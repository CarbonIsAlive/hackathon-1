<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ATEM - Profile Registration</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body {
            background: radial-gradient(circle at center, #1b2e2b 0%, #0d1a18 100%);
            color: #f1f5f9; min-height: 100vh; display: flex;
            justify-content: center; align-items: center;
            font-family: 'Plus Jakarta Sans', sans-serif; padding: 20px;
        }
        .container { width: 100%; max-width: 420px; display: flex; flex-direction: column; align-items: center; }
        .intro-phase { text-align: center; margin-bottom: 1.5rem; }
        .brand-name { font-family: 'Cinzel', serif; font-size: 2.5rem; font-weight: 600; letter-spacing: 0.5rem; color: #ffffff; text-shadow: 0 0 25px rgba(226, 232, 240, 0.2), 0 0 40px rgba(52, 211, 153, 0.15); }
        .tagline { font-size: 0.7rem; font-weight: 300; text-transform: uppercase; letter-spacing: 0.3rem; color: #a7f3d0; margin-top: 0.2rem; }
        
        .card { width: 100%; background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(167, 243, 208, 0.2); border-radius: 20px; padding: 1.5rem; backdrop-filter: blur(12px); box-shadow: 0 12px 30px rgba(0, 0, 0, 0.35); display: flex; flex-direction: column; gap: 1.2rem; box-sizing: border-box; }
        .input-group { display: flex; flex-direction: column; gap: 0.4rem; width: 100%; }
        .input-group label { font-size: 0.7rem; font-weight: 600; letter-spacing: 0.1rem; text-transform: uppercase; color: #cbd5e1; }
        .input-group input { width: 100%; background: rgba(0, 0, 0, 0.2); border: 1px solid rgba(167, 243, 208, 0.2); border-radius: 10px; padding: 0.75rem 1rem; color: #f8fafc; font-family: 'Plus Jakarta Sans', sans-serif; font-size: 0.85rem; outline: none; box-sizing: border-box; }
        .row-group { display: flex; gap: 0.8rem; width: 100%; }
        .row-group .input-group { flex: 1 1 0; min-width: 0; }
        
        .action-btn { width: 100%; background: linear-gradient(135deg, #10b981 0%, #059669 100%); border: 1px solid rgba(167, 243, 208, 0.4); color: #ffffff; padding: 1rem; border-radius: 50px; font-family: 'Plus Jakarta Sans', sans-serif; font-size: 0.8rem; font-weight: 700; letter-spacing: 0.15rem; text-transform: uppercase; cursor: pointer; transition: all 0.3s ease; }
    </style>
</head>
<body>

    <div class="container">
        <div class="intro-phase">
            <h1 class="brand-name">ATEM</h1>
            <p class="tagline">Emergency Care Service</p>
        </div>

        <div class="card">
            <p style="font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.1rem; color: #a7f3d0; text-align: center;">Profile Registration</p>
            <div class="input-group">
                <label for="regName">Full Name</label>
                <input type="text" id="regName" placeholder="John Doe">
            </div>
            <div class="row-group">
                <div class="input-group">
                    <label for="regHostel">Hostel / Block</label>
                    <input type="text" id="regHostel" placeholder="Block A">
                </div>
                <div class="input-group">
                    <label for="regRoom">Room No.</label>
                    <input type="text" id="regRoom" placeholder="402">
                </div>
            </div>
            <button class="action-btn" onclick="saveProfileAndProceed()">Save & Continue Dispatch</button>
        </div>
    </div>

    <script>
        function saveProfileAndProceed() {
            const name = document.getElementById('regName').value.trim();
            const hostel = document.getElementById('regHostel').value.trim();
            const room = document.getElementById('regRoom').value.trim();

            if (!name || !hostel || !room) {
                alert('Please fill out all registration fields.');
                return;
            }

            localStorage.setItem('atem_user', JSON.stringify({ name, hostel, room }));

            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get('redirect') === 'dispatchSelf') {
                window.location.href = '2page.html?autoSelf=true';
            } else {
                window.location.href = '1page.html';
            }
        }
    </script>
</body>
</html>

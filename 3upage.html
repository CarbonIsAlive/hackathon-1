<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ATEM - Emergency Status</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body {
            background: radial-gradient(circle at center, #1b2e2b 0%, #0d1a18 100%);
            color: #f1f5f9; min-height: 100vh;
            display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
            font-family: 'Plus Jakarta Sans', sans-serif; padding: 2rem 1rem;
        }

        .container {
            width: 100%; max-width: 650px; display: flex; flex-direction: column; gap: 1.5rem;
            z-index: 2; margin-top: 1rem;
        }

        .card {
            background: rgba(255, 255, 255, 0.04); border: 1px solid rgba(167, 243, 208, 0.2);
            backdrop-filter: blur(12px); border-radius: 20px; padding: 1.8rem;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.37);
        }

        .status-header {
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid rgba(167, 243, 208, 0.15); padding-bottom: 1rem; margin-bottom: 1.2rem;
        }
        .status-badge {
            background: rgba(52, 211, 153, 0.15); border: 1px solid rgba(52, 211, 153, 0.4);
            color: #34d399; font-size: 0.75rem; font-weight: 700; padding: 0.35rem 0.9rem;
            border-radius: 50px; text-transform: uppercase; letter-spacing: 0.08rem;
        }

        .report-grid {
            display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; font-size: 0.85rem;
        }
        .data-item label { color: #94a3b8; font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.05rem; display: block; margin-bottom: 4px; }
        .data-item span { color: #f8fafc; font-weight: 600; }

        /* Route Map Section */
        .map-section {
            overflow: hidden; display: flex; flex-direction: column; gap: 0.8rem;
        }
        .map-header {
            display: flex; justify-content: space-between; align-items: center;
        }
        .map-title {
            font-size: 0.9rem; font-weight: 700; color: #a7f3d0; text-transform: uppercase; letter-spacing: 0.08rem;
        }
        .map-frame-wrapper {
            width: 100%; height: 320px; border-radius: 12px; overflow: hidden;
            border: 1px solid rgba(167, 243, 208, 0.25); position: relative;
        }
        .map-frame-wrapper iframe {
            width: 100%; height: 100%; border: none; filter: contrast(1.05) saturate(1.1);
        }

        .actions {
            display: flex; gap: 1rem; margin-top: 0.5rem; width: 100%;
        }
        .btn {
            flex: 1; padding: 0.9rem; border-radius: 50px; font-weight: 600; font-size: 0.8rem;
            letter-spacing: 0.08rem; text-transform: uppercase; text-align: center; text-decoration: none;
            cursor: pointer; transition: all 0.3s ease; backdrop-filter: blur(8px); display: block;
        }
        .btn-home {
            background: rgba(167, 243, 208, 0.1); border: 1px solid rgba(167, 243, 208, 0.3); color: #a7f3d0;
        }
        .btn-home:hover { background: #a7f3d0; color: #0d1a18; }
        .btn-call {
            background: rgba(244, 63, 94, 0.15); border: 1px solid rgba(244, 63, 94, 0.4); color: #fecdd3;
        }
        .btn-call:hover { background: #f43f5e; color: #ffffff; }
    </style>
</head>
<body>

    <div class="container">
        <!-- Incident Status Report -->
        <div class="card">
            <div class="status-header">
                <div>
                    <p style="font-size: 0.7rem; color: #94a3b8;">DISPATCH REPORT</p>
                    <h2 id="incId" style="font-size: 1.3rem; color: #ffffff;">INC-84920</h2>
                </div>
                <div class="status-badge">Ambulance En Route</div>
            </div>

            <div class="report-grid">
                <div class="data-item">
                    <label>Patient Name</label>
                    <span id="pName">--</span>
                </div>
                <div class="data-item">
                    <label>Severity Level</label>
                    <span id="pSeverity" style="color: #f87171;">--</span>
                </div>
                <div class="data-item">
                    <label>Origin Location</label>
                    <span>X593+QV Vellore, TN</span>
                </div>
                <div class="data-item">
                    <label>Destination Hostel</label>
                    <span id="pLocation">635N, VIT University</span>
                </div>
            </div>
        </div>

        <!-- Route Navigation Map -->
        <div class="card map-section">
            <div class="map-header">
                <span class="map-title">📍 Dispatch Live Route Map</span>
                <span style="font-size: 0.7rem; color: #94a3b8;">Est. Arrival: 6 Mins</span>
            </div>

            <!-- OPTION 1: Free OpenStreetMap Container -->
            <div class="map-frame-wrapper">
                <iframe 
                    loading="lazy" 
                    src="https://www.openstreetmap.org/export/embed.html?bbox=79.1500%2C12.9650%2C79.1680%2C12.9750&amp;layer=mapnik&amp;marker=12.9692%2C79.1559">
                </iframe>
            </div>

            <!-- OPTION 2: Free Google Maps Search Frame (Uncomment below if you prefer Google styling over OpenStreetMap) -->
            <!--
            <div class="map-frame-wrapper">
                <iframe 
                    loading="lazy"
                    allowfullscreen
                    src="https://maps.google.com/maps?q=VIT%20University%20Vellore%20Tamil%20Nadu&t=&z=15&ie=UTF8&iwloc=&output=embed">
                </iframe>
            </div>
            -->

            <!-- Navigation Button to open exact route in Google Maps App -->
            <a href="https://www.google.com/maps/dir/?api=1&origin=X593%2BQV+Vellore+Tamil+Nadu&destination=635N+VIT+University+Vellore+Tamil+Nadu+632014&travelmode=driving" 
               target="_blank" 
               class="btn btn-home" 
               style="margin-top: 0.5rem;">
               🗺️ Open Turn-by-Turn Route in Google Maps
            </a>
        </div>

        <!-- Action Links -->
        <div class="actions">
            <a href="1page.html" class="btn btn-home">Return Home</a>
            <a href="tel:108" class="btn btn-call">🚑 Call Driver</a>
        </div>
    </div>

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            const data = JSON.parse(localStorage.getItem('atem_dispatch'));
            if (data) {
                if (data.id) document.getElementById('incId').innerText = data.id;
                if (data.patientName) document.getElementById('pName').innerText = data.patientName;
                if (data.severity) document.getElementById('pSeverity').innerText = data.severity;
                if (data.hostel && data.room) document.getElementById('pLocation').innerText = `${data.hostel} - Room ${data.room}`;
            }
        });
    </script>
</body>
</html>

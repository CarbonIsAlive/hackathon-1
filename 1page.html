    <!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>ATEM - Emergency Care Service</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Plus+Jakarta+Sans:wght@300;400;600&display=swap" rel="stylesheet">
        <style>
            * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
            body {
                background: radial-gradient(circle at center, #1b2e2b 0%, #0d1a18 100%);
                color: #f1f5f9; height: 100vh; overflow: hidden;
                display: flex; justify-content: center; align-items: center;
                font-family: 'Plus Jakarta Sans', sans-serif;
                transition: filter 0.5s ease, opacity 0.5s ease;
            }
            body.page-blur { filter: blur(16px); opacity: 0; }
            canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
            
            .top-left-bar { position: absolute; top: 20px; left: 20px; z-index: 10; }
            .history-btn {
                background: rgba(167, 243, 208, 0.1); border: 1px solid rgba(167, 243, 208, 0.3);
                color: #a7f3d0; padding: 0.5rem 1.2rem; font-size: 0.75rem; font-weight: 600;
                letter-spacing: 0.1rem; text-transform: uppercase; border-radius: 50px; cursor: pointer;
                backdrop-filter: blur(8px); transition: all 0.3s ease; display: flex; align-items: center; gap: 6px;
            }
            .history-btn:hover { background: #a7f3d0; color: #0d1a18; }

            .top-bar { position: absolute; top: 20px; right: 20px; z-index: 10; display: flex; gap: 10px; align-items: center; }
            .login-btn {
                background: rgba(56, 189, 248, 0.15); border: 1px solid rgba(56, 189, 248, 0.4);
                color: #38bdf8; padding: 0.5rem 1.2rem; font-size: 0.75rem; font-weight: 600;
                letter-spacing: 0.1rem; text-transform: uppercase; border-radius: 50px; cursor: pointer;
                backdrop-filter: blur(8px); transition: all 0.3s ease;
            }
            .login-btn:hover { background: #38bdf8; color: #0d1a18; }
            
            .user-badge {
                background: rgba(167, 243, 208, 0.1); border: 1px solid rgba(167, 243, 208, 0.3);
                color: #a7f3d0; padding: 0.4rem 1rem; border-radius: 50px; font-size: 0.75rem;
                font-weight: 600; display: flex; gap: 8px; align-items: center; backdrop-filter: blur(8px);
            }
            .logout-sm { color: #f43f5e; cursor: pointer; font-size: 0.65rem; text-decoration: underline; margin-left: 5px; }

            .ui-container {
                position: relative; z-index: 2; display: flex; flex-direction: column;
                align-items: center; justify-content: center; pointer-events: none;
                transition: opacity 0.6s ease, transform 0.6s ease; text-align: center;
            }
            .intro-phase {
                display: flex; flex-direction: column; align-items: center; justify-content: center;
                text-align: center; margin-bottom: 2rem; animation: fadeIn 1.5s ease-out;
            }
            .brand-name {
                font-family: 'Cinzel', serif; font-size: 5rem; font-weight: 500;
                letter-spacing: 0.75rem; color: #ffffff;
                text-shadow: 0 0 25px rgba(226, 232, 240, 0.3), 0 0 50px rgba(52, 211, 153, 0.15);
                padding-left: 0.75rem; margin: 0 auto;
            }
            .tagline {
                font-family: 'Britannic Bold', 'Britannic', 'Trebuchet MS', sans-serif;
                font-size: 1.15rem; font-style: italic; font-weight: bold;
                letter-spacing: 0.12rem; color: #a7f3d0;
                text-shadow: 0 0 12px rgba(167, 243, 208, 0.3);
                margin-top: 0.2rem; text-align: center; width: 100%;
            }
            
            .interactive-wrapper { pointer-events: auto; display: flex; flex-direction: column; align-items: center; gap: 1rem; }
            .emergency-btn {
                background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(167, 243, 208, 0.25);
                backdrop-filter: blur(10px); padding: 1.1rem 2.6rem; font-size: 0.85rem;
                font-weight: 600; color: #f8fafc; letter-spacing: 0.2rem; text-transform: uppercase;
                border-radius: 50px; cursor: pointer; transition: all 0.5s ease;
            }
            .emergency-btn:hover { background: rgba(255, 255, 255, 0.12); border-color: rgba(167, 243, 208, 0.5); }

            /* Quick Direct Call Buttons Container */
            .call-buttons-group {
                display: flex; gap: 0.8rem; width: 100%; justify-content: center;
            }
            .call-btn {
                text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 6px;
                padding: 0.75rem 1.4rem; font-size: 0.75rem; font-weight: 700; letter-spacing: 0.1rem;
                text-transform: uppercase; border-radius: 50px; backdrop-filter: blur(8px);
                transition: all 0.3s ease;
            }
            .call-btn.ambulance {
                background: rgba(244, 63, 94, 0.15); border: 1px solid rgba(244, 63, 94, 0.4); color: #fecdd3;
            }
            .call-btn.ambulance:hover {
                background: #f43f5e; color: #ffffff; box-shadow: 0 0 20px rgba(244, 63, 94, 0.4);
            }
            .call-btn.warden {
                background: rgba(56, 189, 248, 0.15); border: 1px solid rgba(56, 189, 248, 0.4); color: #bae6fd;
            }
            .call-btn.warden:hover {
                background: #38bdf8; color: #0d1a18; box-shadow: 0 0 20px rgba(56, 189, 248, 0.4);
            }

            .ui-fade-out { opacity: 0; transform: scale(0.96) translateY(-10px); }

            .staircase-transition { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; display: flex; pointer-events: none; z-index: 9999; transition: filter 0.5s ease, opacity 0.5s ease; }
            .staircase-transition.blur-out { filter: blur(20px); opacity: 0; }
            .staircase-step { flex: 1; height: 100%; background: #091312; border-right: 1px solid rgba(167, 243, 208, 0.12); transform: translateY(-101%); transition: transform 0.75s cubic-bezier(0.85, 0, 0.15, 1); }
            .staircase-transition.active .staircase-step { transform: translateY(0%); }
            .staircase-transition.active .staircase-step:nth-child(1) { transition-delay: 0.00s; }
            .staircase-transition.active .staircase-step:nth-child(2) { transition-delay: 0.08s; }
            .staircase-transition.active .staircase-step:nth-child(3) { transition-delay: 0.16s; }
            .staircase-transition.active .staircase-step:nth-child(4) { transition-delay: 0.24s; }
            .staircase-transition.active .staircase-step:nth-child(5) { transition-delay: 0.32s; }
            .staircase-transition.active .staircase-step:nth-child(6) { transition-delay: 0.40s; }
        </style>
    </head>
    <body>

        <div class="staircase-transition" id="staircaseTransition">
            <div class="staircase-step"></div><div class="staircase-step"></div>
            <div class="staircase-step"></div><div class="staircase-step"></div>
            <div class="staircase-step"></div><div class="staircase-step"></div>
        </div>

        <div class="top-left-bar">
            <button class="history-btn" onclick="window.location.href='history.html'">📜 History</button>
        </div>

        <div class="top-bar" id="topBar"></div>

        <canvas id="particleCanvas"></canvas>

        <div class="ui-container" id="uiContainer">
            <div class="intro-phase">
                <h1 class="brand-name">ATEM</h1>
                <p class="tagline">"Every breath, answered"</p>
            </div>
            <div class="interactive-wrapper">
                <button class="emergency-btn" onclick="triggerStaircaseTransition('2page.html')">REPORT EMERGENCY NOW</button>
                
                <div class="call-buttons-group">
                    <a href="tel:108" class="call-btn ambulance">🚑 Call Ambulance (108)</a>
                    <a href="tel:9539462365" class="call-btn warden">📞 Call Warden</a>
                </div>
            </div>
        </div>

        <script>
            window.addEventListener('DOMContentLoaded', updateHeaderSession);

            function updateHeaderSession() {
                const user = JSON.parse(localStorage.getItem('atem_user'));
                const topBar = document.getElementById('topBar');
                if (user) {
                    topBar.innerHTML = `
                        <div class="user-badge">
                            <span>👤 ${user.name} (${user.hostel}-${user.room})</span>
                            <span class="logout-sm" onclick="logout()">Logout</span>
                        </div>`;
                } else {
                    topBar.innerHTML = `<button class="login-btn" onclick="window.location.href='logg.html'">Login / Register</button>`;
                }
            }

            function logout() {
                localStorage.removeItem('atem_user');
                updateHeaderSession();
            }

            function triggerStaircaseTransition(targetUrl) {
                const transitionOverlay = document.getElementById('staircaseTransition');
                document.getElementById('uiContainer').classList.add('ui-fade-out');
                document.getElementById('particleCanvas').style.opacity = '0.3';
                transitionOverlay.classList.add('active');
                
                setTimeout(() => {
                    transitionOverlay.classList.add('blur-out');
                    document.body.classList.add('page-blur');
                }, 1100);

                setTimeout(() => { window.location.href = targetUrl; }, 1500);
            }

            const canvas = document.getElementById('particleCanvas'), ctx = canvas.getContext('2d');
            let width, height, particles = [];
            function resize() { width = canvas.width = window.innerWidth; height = canvas.height = window.innerHeight; }
            window.addEventListener('resize', resize);
            class Particle {
                constructor() { this.init(); }
                init() {
                    this.x = Math.random() * width; this.y = Math.random() * height;
                    this.radius = Math.random() * 2 + 1;
                    this.vx = (Math.random() - 0.5) * 0.4; this.vy = (Math.random() - 0.5) * 0.4;
                }
                update() {
                    this.x += this.vx; this.y += this.vy;
                    if (this.x < 0 || this.x > width) this.vx *= -1;
                    if (this.y < 0 || this.y > height) this.vy *= -1;
                }
                draw() {
                    ctx.beginPath(); ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                    ctx.fillStyle = 'rgba(167, 243, 208, 0.6)'; ctx.fill();
                }
            }
            function initParticles() { particles = Array.from({length: 80}, () => new Particle()); }
            function animate() {
                ctx.clearRect(0, 0, width, height);
                particles.forEach(p => { p.update(); p.draw(); });
                requestAnimationFrame(animate);
            }
            resize(); initParticles(); animate();
        </script>
    </body>
    </html>
